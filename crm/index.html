<!doctype html>
<html lang="ru">
<title>CRM «Отдел продаж»</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F5F4; --panel:#FFFFFF; --ink:#18221F; --muted:#5E6B67; --line:#DCE2DF; --soft:#E9EEEC;
  --accent:#0F6E5C; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --ok:#2E7D32; --ok-soft:#E3F2E4; --warn:#A86200; --warn-soft:#FBEFD9; --bad:#B3261E; --bad-soft:#F9E1DF;
  --info:#2B5FA8; --info-soft:#E1EAF7;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 4px 16px rgba(20,40,35,.06);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111715; --panel:#18201D; --ink:#E4ECE9; --muted:#9AAAA4; --line:#2B3632; --soft:#202A27;
    --accent:#4DBFA3; --accent-ink:#0B1412; --accent-soft:#1C3A33;
    --ok:#7BC47F; --ok-soft:#1D3320; --warn:#E3A64B; --warn-soft:#3A2C14; --bad:#F08A80; --bad-soft:#3D1D1A;
    --info:#8DB4EE; --info-soft:#1C2A40; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111715; --panel:#18201D; --ink:#E4ECE9; --muted:#9AAAA4; --line:#2B3632; --soft:#202A27;
  --accent:#4DBFA3; --accent-ink:#0B1412; --accent-soft:#1C3A33;
  --ok:#7BC47F; --ok-soft:#1D3320; --warn:#E3A64B; --warn-soft:#3A2C14; --bad:#F08A80; --bad-soft:#3D1D1A;
  --info:#8DB4EE; --info-soft:#1C2A40; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;font-weight:600} h2{font-size:18px;font-weight:600} h3{font-size:15px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)} .mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.small{font-size:13px}

/* layout */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px}
.brand b{display:block;font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:grid;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.me{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:13px;display:grid;gap:6px}
.main{padding:22px 28px 60px;min-width:0;display:grid;gap:18px;align-content:start}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
td.r,th.r{text-align:right}

.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* timeline */
.tl{display:grid;gap:0}
.tl-item{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
.tl-item:last-child{border-bottom:0}
.tl-date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* bars */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col i{display:block;width:100%;max-width:46px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.col span{font-size:11px;color:var(--muted);white-space:nowrap}
.col-l{display:flex;gap:10px}.col-l span{flex:1;text-align:center;font-size:12px;color:var(--muted)}

/* criteria */
.crit{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.crit:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* stages */
.stages{display:grid;gap:0;counter-reset:st}
.stage{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft)}
.stage .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--soft);color:var(--muted)}
.stage.done .n{background:var(--ok);color:#fff} .stage.work .n{background:var(--warn);color:#fff}
.stage select{width:auto}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login .box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow)}
.demo{display:grid;gap:6px}
.demo button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:6px;font-size:13px}
.demo button:hover{border-color:var(--accent)}
.demo button:focus-visible{outline:2px solid var(--accent)}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,20,17,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--panel);border-radius:12px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px)}
.note{padding:10px 12px;border-radius:8px;font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)} .note.info{background:var(--info-soft);color:var(--info)}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:2px solid transparent;font-weight:500;color:var(--muted)}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 16px;gap:10px}
  .nav{display:flex;flex-wrap:wrap;gap:4px}
  .me{margin:0;border:0;padding:0;display:flex;align-items:center}
  .main{padding:16px 16px 60px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
  .bar{grid-template-columns:90px 1fr 80px}
}
@media (max-width:520px){ .form{grid-template-columns:1fr} .tl-item{grid-template-columns:1fr;gap:2px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

const fmtDate = s => s ? new Date(s).toLocaleDateString('ru-RU') : '—';
const fmtDT = s => s ? new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';

const pct = n => (isFinite(n) ? Math.round(n) : 0) + ' %';

/* ============ Нормализация и поиск дублей ============ */
const normPhone = p => { let d = String(p||'').replace(/\D/g,''); if(d.length===11 && (d[0]==='8'||d[0]==='7')) d = d.slice(1); return d.length>=10 ? d.slice(-10) : ''; };
const normEmail = e => String(e||'').trim().toLowerCase();
const normName = n => (' '+String(n||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"'.,\-()]/g,' ')+' ').replace(/\s(ооо|оао|зао|пао|ао|ип)(?=\s)/g,' ').replace(/\s+/g,' ').trim();
const normInn = i => String(i||'').replace(/\D/g,'');
function dupKeys(c){
  const k = [];
  if(normPhone(c.phone)) k.push('p:'+normPhone(c.phone));
  if(normEmail(c.email)) k.push('e:'+normEmail(c.email));
  if(normInn(c.inn).length>=10) k.push('i:'+normInn(c.inn));
  if(normName(c.name).length>2) k.push('n:'+normName(c.name));
  return k;
}
function findDuplicate(c, list, exceptId){
  const keys = new Set(dupKeys(c));
  return list.find(x => x.id!==exceptId && dupKeys(x).some(k => keys.has(k)));
}
function duplicateGroups(list){
  const parent = {}; const f = x => parent[x]===x ? x : (parent[x]=f(parent[x]));
  list.forEach(c => parent[c.id]=c.id);
  const byKey = {};
  list.forEach(c => dupKeys(c).forEach(k => { if(byKey[k]) parent[f(c.id)] = f(byKey[k]); else byKey[k]=c.id; }));
  const g = {}; list.forEach(c => (g[f(c.id)] ||= []).push(c));
  return Object.values(g).filter(x => x.length>1);
}

/* ============ Резервные копии ============ */
function makeBackup(label){
  const b = {id:uid(), date:today(), label, by: me?me.name:'Система', data: JSON.parse(JSON.stringify(S)),
    counts:{clients:S.clients.length, deals:S.deals.length, interactions:S.interactions.length}};
  backups.unshift(b); backups = backups.slice(0,15);
  if(!store.set(BKEY, backups)) toast('Копия создана только до закрытия страницы: хранилище браузера недоступно');
  return b;
}
function restoreBackup(id){
  const b = backups.find(x=>x.id===id); if(!b) return;
  makeBackup('Автокопия перед восстановлением');
  const keepUser = me && me.id;
  S = JSON.parse(JSON.stringify(b.data));
  log('Восстановление из резервной копии от ' + fmtDT(b.date) + ' («' + b.label + '»)');
  save();
  me = S.users.find(u=>u.id===keepUser) || null;
  toast('Данные восстановлены из копии от ' + fmtDT(b.date));
}

/* ============ Файлы ============ */
function download(name, content, type){
  try{
    const blob = content instanceof Blob ? content : new Blob([content], {type});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }catch(e){ toast('Браузер не разрешил скачивание'); }
}
function exportExcel(){
  const rows = visibleClients().map(c=>({'Компания':c.name,'Контактное лицо':c.contact,'Телефон':c.phone,'Email':c.email,'ИНН':c.inn,'Город':c.city,'Источник':c.source,'Менеджер':userName(c.owner),'Создан':fmtDate(c.created)}));
  const deals = visibleDeals().map(d=>({'Клиент':(S.clients.find(c=>c.id===d.clientId)||{}).name,'Заявка':d.title,'Сумма':d.amount,'Статус':DEAL[d.status][0],'Менеджер':userName(d.owner),'Создана':fmtDate(d.created),'Закрыта':fmtDate(d.closed)}));
  if(window.XLSX){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Клиенты');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(deals), 'Заявки');
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    download('crm_klienty_'+new Date().toISOString().slice(0,10)+'.xlsx', new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  } else {
    const h = Object.keys(rows[0]||{}); const csv = '﻿'+[h.join(';'), ...rows.map(r=>h.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\n');
    download('crm_klienty.csv', csv, 'text/csv;charset=utf-8');
  }
  log('Выгрузка клиентской базы в Excel ('+rows.length+' записей)'); save();
}
function parseCSV(text){
  const sep = (text.split('\n')[0].match(/;/g)||[]).length >= (text.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cell); cell=''; }
    else if(ch==='\n'){ row.push(cell.replace(/\r$/,'')); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function modal(html, onMount){
  const o = document.createElement('div'); o.className='overlay';
  o.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  o.addEventListener('click', e=>{ if(e.target===o || e.target.closest('[data-close]')) o.remove(); });
  document.body.appendChild(o); onMount && onMount(o.querySelector('.modal'), ()=>o.remove());
  const f = o.querySelector('input,select,textarea,button.primary'); f && f.focus();
}

function setDealStatus(id, st){
  const d = S.deals.find(x=>x.id===id); if(!d) return;
  const old = d.status; d.status = st;
  d.closed = (st==='won'||st==='lost') ? (d.closed || today()) : null;
  S.interactions.push({id:uid(), clientId:d.clientId, userId:me.id, type:'system', text:'Заявка «'+d.title+'»: '+DEAL[old][0]+' → '+DEAL[st][0], date:today()});
  const c = S.clients.find(x=>x.id===d.clientId); if(c) c.updated=today();
  log('Статус заявки «'+d.title+'» изменён на «'+DEAL[st][0]+'»'); save(); render();
}

/* ---------- Метрики ---------- */
function metrics(){
  const closed = S.deals.filter(d=>d.closed);
  const avgDealH = closed.length ? closed.reduce((s,d)=>s+(new Date(d.closed)-new Date(d.created))/3600e3,0)/closed.length : 0;
  const srch = S.metrics.searches.slice(-50);
  const avgSearch = srch.length ? srch.reduce((s,x)=>s+x.sec,0)/srch.length : 0;
  const lastImp = S.imports[0];
  const migrated = lastImp ? (lastImp.created+lastImp.merged)/Math.max(1,lastImp.total-lastImp.empty)*100 : null;
  const pilot = S.users.filter(u=>u.role==='manager'&&u.pilot);
  const monthAgo = Date.now()-30*864e5;
  const activeRecent = uid => S.interactions.some(i=>i.userId===uid && i.type!=='system' && new Date(i.date).getTime()>monthAgo) || S.log.some(l=>l.user===userName(uid) && new Date(l.date).getTime()>monthAgo);
  const pilotActive = pilot.filter(u=>activeRecent(u.id)).length;
  return {avgDealH, avgSearch, searchCnt:srch.length, migrated, lastImp, dups:duplicateGroups(S.clients).length,
    searchGain: avgSearch ? (1-avgSearch/S.settings.baselineSearchSec)*100 : 0,
    dealGain: avgDealH ? (1-avgDealH/S.settings.baselineDealHours)*100 : 0,
    pilot: pilot.length, pilotActive};
}
function criteriaList(){
  const m = metrics();
  const st = (ok, warnCond) => ok ? 'ok' : (warnCond ? 'warn' : 'bad');
  return [
    ['100 % клиентской базы перенесено без потерь', m.migrated==null ? 'Импорт ещё не выполнялся' : 'Последний импорт: '+pct(m.migrated)+' строк перенесено', m.migrated==null?'warn':st(m.migrated>=100, m.migrated>=95)],
    ['Все менеджеры пилотной группы работают в CRM', m.pilotActive+' из '+m.pilot+' активны за последние 30 дней', st(m.pilotActive===m.pilot, m.pilotActive>=m.pilot*0.7)],
    ['Время поиска информации о клиенте сократилось на 50 % и более', 'Сейчас '+m.avgSearch.toFixed(1)+' с против '+S.settings.baselineSearchSec+' с до внедрения (−'+pct(m.searchGain)+')', st(m.searchGain>=50, m.searchGain>=30)],
    ['Время обработки заявки сократилось на 30 % и более', 'Сейчас '+m.avgDealH.toFixed(1)+' ч против '+S.settings.baselineDealHours+' ч до внедрения (−'+pct(m.dealGain)+')', st(m.dealGain>=30, m.dealGain>=15)],
    ['Снизилось дублирование данных', m.dups ? 'Осталось групп дублей: '+m.dups : 'Дублей в базе нет', st(m.dups===0, m.dups<=3)],
    ['Руководитель получает отчёты из системы', 'Раздел «Отчёты» формируется автоматически по актуальным данным', 'ok'],
  ];
}
const critHtml = () => criteriaList().map(c=>`<div class="crit"><span class="dot ${c[2]}" aria-hidden="true"></span><div><b>${esc(c[0])}</b><div class="small muted">${esc(c[1])}</div></div>${pill(c[2]==='ok'?'Выполнено':c[2]==='warn'?'Близко':'Не выполнено', c[2])}</div>`).join('');

/* ---------- Отчёты ---------- */
function reportsView(){
  const now = new Date(); const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const won = S.deals.filter(d=>d.status==='won'); const lost = S.deals.filter(d=>d.status==='lost');
  const open = S.deals.filter(d=>!['won','lost'].includes(d.status));
  const wonMonth = won.filter(d=>new Date(d.closed)>=monthStart).reduce((s,d)=>s+d.amount,0);
  const conv = won.length+lost.length ? won.length/(won.length+lost.length)*100 : 0;
  const m = metrics();
  const funnel = Object.keys(DEAL).map(k=>[k, S.deals.filter(d=>d.status===k)]);
  const maxF = Math.max(1,...funnel.map(f=>f[1].length));
  const months = []; for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }
  const mSum = months.map(ms=>{ const me2 = new Date(ms.getFullYear(), ms.getMonth()+1, 1); return won.filter(d=>{const t=new Date(d.closed); return t>=ms && t<me2;}).reduce((s,d)=>s+d.amount,0); });
  const maxM = Math.max(1,...mSum);
  const managers = S.users.filter(u=>u.role==='manager');
  const byM = managers.map(u=>{ const ds = S.deals.filter(d=>d.owner===u.id); const w = ds.filter(d=>d.status==='won'); const cl = ds.filter(d=>d.closed);
    return {u, clients:S.clients.filter(c=>c.owner===u.id).length, open:ds.filter(d=>!d.closed).length, won:w.reduce((s,d)=>s+d.amount,0),
      conv: cl.length? w.length/cl.length*100 : 0, h: cl.length ? cl.reduce((s,d)=>s+(new Date(d.closed)-new Date(d.created))/3600e3,0)/cl.length : 0}; }).sort((a,b)=>b.won-a.won);
  return `<div class="topline"><h1>Отчёты для руководителя</h1><span class="small muted">Данные на ${fmtDT(today())}</span></div>
    <div class="kpis">
      <div class="kpi"><small>Продажи за месяц</small><b>${money(wonMonth)}</b></div>
      <div class="kpi"><small>В работе</small><b>${money(open.reduce((s,d)=>s+d.amount,0))}</b><em>${open.length} заявок</em></div>
      <div class="kpi"><small>Конверсия</small><b>${pct(conv)}</b><em>успешные / закрытые</em></div>
      <div class="kpi"><small>Обработка заявки</small><b>${m.avgDealH.toFixed(1)} ч</b><em>было ${S.settings.baselineDealHours} ч</em></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Воронка заявок</h3><div class="bars">${funnel.map(([k,ds])=>`<div class="bar"><span>${DEAL[k][0]}</span><div class="track"><div class="fill" style="width:${ds.length/maxF*100}%"></div></div><span class="num r small">${ds.length} · ${money(ds.reduce((s,d)=>s+d.amount,0))}</span></div>`).join('')}</div></div>
      <div class="panel"><h3>Успешные продажи по месяцам</h3>
        <div class="cols">${mSum.map(v=>`<div class="col"><span class="num">${v?Math.round(v/1000)+'k':''}</span><i style="height:${v/maxM*100}%"></i></div>`).join('')}</div>
        <div class="col-l">${months.map(d=>`<span>${d.toLocaleDateString('ru-RU',{month:'short'})}</span>`).join('')}</div></div>
    </div>
    <div class="panel tw"><h3>Результаты менеджеров</h3><table><thead><tr><th>Менеджер</th><th class="r">Клиентов</th><th class="r">Открыто</th><th class="r">Продажи</th><th class="r">Конверсия</th><th class="r">Ср. обработка</th></tr></thead><tbody>
      ${byM.map(r=>`<tr><td>${esc(r.u.name)} ${r.u.pilot?pill('пилот','acc'):''}</td><td class="r">${r.clients}</td><td class="r">${r.open}</td><td class="r">${money(r.won)}</td><td class="r">${pct(r.conv)}</td><td class="r">${r.h?r.h.toFixed(1)+' ч':'—'}</td></tr>`).join('')}

}

let importState = null;
const FIELDS = {name:'Компания / ФИО', contact:'Контактное лицо', phone:'Телефон', email:'Email', inn:'ИНН', city:'Город', owner:'Менеджер', note:'Комментарий', skip:'— не переносить —'};
function guessField(h){
  h = String(h||'').toLowerCase();
  if(/инн/.test(h)) return 'inn';
  if(/тел|phone|моб/.test(h)) return 'phone';
  if(/mail|почт/.test(h)) return 'email';
  if(/контакт|лицо/.test(h)) return 'contact';
  if(/город|city/.test(h)) return 'city';
  if(/менедж|ответств/.test(h)) return 'owner';
  if(/коммент|примеч|заметк/.test(h)) return 'note';
  if(/компан|клиент|наимен|назван|фио|организ/.test(h)) return 'name';
  return 'skip';
}

function rowToClient(r){
  const o = {}; importState.map.forEach((f,i)=>{ if(f!=='skip'){ const v = String(r[i]??'').trim(); if(v) o[f] = o[f] ? o[f]+'; '+v : v; } }); return o;
}
function analyzeImport(){
  let created=0, merged=0, empty=0; const pool = [...S.clients];
  importState.rows.forEach(r=>{ const o = rowToClient(r); if(!o.name){ empty++; return; }
    if(findDuplicate(o,pool)) merged++; else { created++; pool.push({id:'tmp'+created, ...o}); } });
  return {created, merged, empty};
}
function runImport(){
  const b = makeBackup('Перед импортом «'+importState.fileName+'»');
  const managers = S.users.filter(u=>u.role==='manager');
  let created=0, merged=0, empty=0, rr=0;
  importState.rows.forEach(r=>{
    const o = rowToClient(r); if(!o.name){ empty++; return; }
    const owner = (o.owner && managers.find(m=>m.name.toLowerCase().includes(o.owner.toLowerCase().split(' ')[0]))) || managers[rr++ % managers.length];
    const d = findDuplicate(o, S.clients);
    if(d){ ['contact','phone','email','inn','city'].forEach(k=>{ if(!d[k] && o[k]) d[k]=o[k]; }); d.updated=today();
      S.interactions.push({id:uid(), clientId:d.id, userId:me.id, type:'system', text:'Объединено с записью из файла «'+importState.fileName+'»'+(o.note?'. Комментарий: '+o.note:''), date:today()}); merged++; }
    else { const c = {id:uid(), name:o.name, contact:o.contact||'', phone:o.phone||'', email:o.email||'', inn:o.inn||'', city:o.city||'', source:'Excel', owner:owner.id, created:today(), updated:today()};
      S.clients.push(c); S.interactions.push({id:uid(), clientId:c.id, userId:me.id, type:'system', text:'Перенесён из файла «'+importState.fileName+'»'+(o.note?'. Комментарий: '+o.note:''), date:today()}); created++; }
  });
  const rec = {id:uid(), date:today(), file:importState.fileName, total:importState.rows.length, created, merged, empty, backup:b.id};
  S.imports.unshift(rec);
  const st = S.plan.find(p=>p.id==='s5'); if(st && st.status!=='done') st.status='done';
  log('Импорт «'+importState.fileName+'»: строк '+rec.total+', новых '+created+', объединено '+merged+', пустых '+empty);
  save(); importState=null; render();
  toast(rec.created+rec.merged+rec.empty===rec.total ? 'Перенос завершён, потерь нет' : 'Перенос завершён с расхождением, проверьте журнал');
}
function loadRows(fileName, aoa){
  aoa = aoa.filter(r=>r && r.some(v=>String(v??'').trim()!==''));
  if(aoa.length<2){ toast('В файле нет строк с данными'); return; }
  const headers = aoa[0].map(h=>String(h??'').trim());
  importState = {fileName, headers, rows:aoa.slice(1), map:headers.map(guessField)};
  render();
}

function dupsPanel(){
  const groups = duplicateGroups(S.clients);
  return `<div class="panel" id="dups"><h3>Дубли в базе</h3>${groups.length?`<p class="small muted" style="margin:0 0 10px">Совпадение по телефону, email, ИНН или названию. При объединении история и заявки переносятся в основную запись, пустые поля заполняются из дубля.</p>
    ${groups.map(g=>`<div style="border-top:1px solid var(--soft);padding:10px 0;display:grid;gap:6px">${g.map((c,i)=>`<div class="row small">${i===0?pill('Основная','ok'):pill('Дубль','warn')} <b>${esc(c.name)}</b> <span class="muted">${esc([c.phone,c.email,c.inn].filter(Boolean).join(' · '))} · ${esc(userName(c.owner))}</span></div>`).join('')}
      <div><button class="btn small" data-merge="${g.map(c=>c.id).join(',')}">Объединить в «${esc(g[0].name)}»</button></div></div>`).join('')}`:'<div class="note ok">Дублей не найдено</div>'}</div>`;

function mergeGroup(ids){
  const [mainId, ...rest] = ids; const main = S.clients.find(c=>c.id===mainId);
  rest.forEach(id=>{ const d = S.clients.find(c=>c.id===id); if(!d) return;
    ['contact','phone','email','inn','city'].forEach(k=>{ if(!main[k] && d[k]) main[k]=d[k]; });
    S.deals.forEach(x=>{ if(x.clientId===id) x.clientId=mainId; });
    S.interactions.forEach(x=>{ if(x.clientId===id) x.clientId=mainId; });
    S.interactions.push({id:uid(), clientId:mainId, userId:me.id, type:'system', text:'Объединено с дублем «'+d.name+'»', date:today()});
    S.clients = S.clients.filter(c=>c.id!==id); });
  main.updated = today(); log('Объединены дубли в «'+main.name+'» ('+rest.length+')'); save(); render(); toast('Дубли объединены');
}

function userModal(u){
  const isNew = !u;
  modal(`<h2>${isNew?'Новый пользователь':'Смена пароля: '+esc(u.name)}</h2><form class="form">
    ${isNew?`<label class="full">ФИО *<input id="u_name" required></label><label>Логин *<input id="u_login" required autocomplete="off"></label>

    <label class="${isNew?'':'full'}">Пароль *<input id="u_pass" type="text" required autocomplete="new-password" minlength="4"></label></form>
    <div class="actions"><button class="btn" data-close>Отмена</button><button class="btn primary" id="saveU">Сохранить</button></div>`, (m,close)=>{
    m.querySelector('#saveU').onclick=()=>{
      const pass = m.querySelector('#u_pass').value; if(pass.length<4){ toast('Пароль должен быть не короче 4 символов'); return; }
      if(isNew){ const name=m.querySelector('#u_name').value.trim(), login=m.querySelector('#u_login').value.trim().toLowerCase();
        if(!name||!login){ toast('Заполните ФИО и логин'); return; }
        if(S.users.some(x=>x.login===login)){ toast('Логин «'+login+'» уже занят'); return; }
        S.users.push({id:uid(), name, login, pass, role:m.querySelector('#u_role').value, pilot:false, active:true}); log('Добавлен пользователь '+name+' ('+login+')'); }
      else { u.pass = pass; log('Изменён пароль пользователя '+u.name); }
      save(); close(); render(); toast('Сохранено');
    };
  });
}

      view='clients'; openClient=tr.dataset.client; render(); window.scrollTo(0,0); };

  const rb1=$('#rb1'), rb2=$('#rb2');
  if(rb1){ const pilot=S.users.filter(u=>u.pilot).length; const upd=()=>{ const share = (+rb2.value||0)/Math.max(1,pilot)*100; const need = rb1.checked || share>30;
      $('#rbVerdict').innerHTML = need ? `<div class="note bad"><b>Требуется аварийный откат.</b> ${rb1.checked?'Зафиксирована потеря данных. ':''}${share>30?'Не могут работать '+Math.round(share)+' % пилотной группы (порог 30 %).':''}</div>` : `<div class="note ok">Критических условий нет, откат не требуется. Не могут работать ${Math.round(share)} % пилотной группы при пороге 30 %.</div>`; };
    rb1.onchange=upd; rb2.oninput=upd; upd(); }
  on('goBackups', ()=>{ view='admin'; sub='backups'; render(); });
  // перенос
  const file=$('#file'); if(file) file.onchange=()=>{ const f=file.files[0]; if(!f) return; const rd=new FileReader();
    if(/\.csv$/i.test(f.name)){ rd.onload=()=>loadRows(f.name, parseCSV(String(rd.result))); rd.readAsText(f,'utf-8'); }
    else { if(!window.XLSX){ toast('Для Excel нужна библиотека XLSX, сохраните файл как CSV'); return; }
      rd.onload=()=>{ try{ const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'}); loadRows(f.name, XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})); }catch(e){ toast('Не удалось прочитать файл: '+e.message); } };
      rd.readAsArrayBuffer(f); } };
  on('demoImp', demoFile);
  on('cancelImp', ()=>{ importState=null; render(); });
  main.querySelectorAll('[data-map]').forEach(s=>s.onchange=()=>{ importState.map[+s.dataset.map]=s.value; render(); });
  on('runImp', runImport);
  main.querySelectorAll('[data-merge]').forEach(b=>b.onclick=()=>mergeGroup(b.dataset.merge.split(',')));
  // админ
  on('newUser', ()=>userModal(null));
  main.querySelectorAll('[data-upass]').forEach(b=>b.onclick=()=>userModal(S.users.find(u=>u.id===b.dataset.upass)));
  main.querySelectorAll('[data-urole]').forEach(s=>s.onchange=()=>{ const u=S.users.find(x=>x.id===s.dataset.urole); u.role=s.value; if(u.role!=='manager') u.pilot=false; log('Роль '+u.name+': '+ROLES[u.role]); save(); render(); });
  main.querySelectorAll('[data-upilot]').forEach(c=>c.onchange=()=>{ const u=S.users.find(x=>x.id===c.dataset.upilot); u.pilot=c.checked; log(u.name+(u.pilot?' включён в':' исключён из')+' пилотную группу'); save(); render(); });
  main.querySelectorAll('[data-ublock]').forEach(b=>b.onclick=()=>{ const u=S.users.find(x=>x.id===b.dataset.ublock); u.active=!u.active; log((u.active?'Разблокирован ':'Заблокирован ')+u.name); save(); render(); });
  on('mkBackup', ()=>{ makeBackup('Ручная копия'); log('Создана резервная копия'); save(); render(); toast('Резервная копия создана'); });
  on('dlBackup', ()=>{ download('crm_backup_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(S,null,1), 'application/json'); log('Скачана резервная копия'); save(); });
  const up=$('#upBackup'); if(up) up.onchange=()=>{ const f=up.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
      if(!d.clients||!d.users) throw new Error('это не файл резервной копии CRM');
      backups.unshift({id:uid(), date:today(), label:'Загружена из файла «'+f.name+'»', by:me.name, data:d, counts:{clients:d.clients.length, deals:(d.deals||[]).length, interactions:(d.interactions||[]).length}});
      store.set(BKEY,backups); render(); toast('Копия загружена, её можно восстановить'); }catch(e){ toast('Не удалось загрузить: '+e.message); } }; rd.readAsText(f); };
  main.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{ const bk=backups.find(x=>x.id===b.dataset.restore);
    confirmBox('Восстановить данные?', 'Текущие данные будут заменены копией от <b>'+fmtDT(bk.date)+'</b> ('+bk.counts.clients+' клиентов). Перед заменой текущее состояние сохраняется в новую резервную копию.', 'Восстановить', ()=>{ restoreBackup(bk.id); render(); }, true); });
  on('resetDemo', ()=>confirmBox('Сбросить к демо-данным?', 'Все изменения будут заменены демонстрационными данными. Текущее состояние сначала сохраняется в резервную копию.', 'Сбросить', ()=>{
    makeBackup('Перед сбросом к демо-данным'); const id=me.id; S=seed(); save(); me=S.users.find(u=>u.id===id)||null; if(!me) store.del(SKEY); view='clients'; sub=null; render(); toast('Демо-данные восстановлены'); }, true));
}

render();
</script>
